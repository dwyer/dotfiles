# tmux sends 24-bit colour through to the outer terminal only where it thinks
# that terminal can take it, and it decides that from the terminal's terminfo.
# xterm-256color does not advertise RGB, so everything 24-bit gets flattened to
# the nearest of the 256 palette entries on the way out: solarized's blue-greys
# average out into the greyscale ramp and arrive neutral, which is visible
# anywhere a highlight paints a background -- vim's CursorLine, ColorColumn,
# the popup menu -- and shows up as vim looking different inside tmux and out.
#
# $COLORTERM is how a truecolor terminal says so when its terminfo entry does
# not, and it is what ~/.vimrc consults for the same decision, so consult it
# here too and keep the two in agreement. The catch is that this reads the tmux
# server's environment, fixed when the server started, so a later client
# attaching from a poorer terminal is judged by the first one's $COLORTERM.
# Getting that wrong costs approximate colour, which is what not setting this
# costs anyway.
if-shell '[ "$COLORTERM" = "truecolor" ] || [ "$COLORTERM" = "24bit" ]' \
    'set -as terminal-features ",*:RGB"'

# Machine-local settings, as with the shell files.
if-shell '[ -f ~/.tmux.conf.local ]' 'source-file ~/.tmux.conf.local'

# Mouse mode puts the scroll wheel on a pane's history and lets a click pick a
# pane or window, at the cost of the terminal's own selection: a drag now marks
# a block in tmux's copy mode instead, and reaching the system clipboard means
# holding SHIFT to pass the drag through untouched.
#
# Focus events are how a terminal tells the program inside it that its window
# has gained or lost focus. tmux swallows them unless this is on, and passes
# them to the active pane when it is, synthesising a pair of its own each time
# the active pane changes -- so an application learns whether it is the thing
# being looked at, not merely whether the terminal is frontmost. vim wants that
# for FocusGained and FocusLost; anything that would rather not interrupt while
# you are elsewhere wants it to know that you are. The catch is that tmux only
# asks the outer terminal for focus reporting as a client attaches, so setting
# this on a running server takes a reattach and not just a source-file.
set -g mouse on
set -g focus-events on

# With the mouse on, a drag ends in a tmux paste buffer, which is tmux's own
# and invisible to the X selections every other program means by "the
# clipboard" -- so the text is copied in the sense that tmux can paste it back
# and in no other sense. copy-pipe-and-cancel hands the selection to a command
# on stdin as well, and `xsel -ib` puts it in CLIPBOARD, where C-v finds it.
#
# tmux picks the copy-mode key table from $EDITOR when the server starts, the
# same accident of inheritance that decides zsh's keymap above, so which of
# copy-mode and copy-mode-vi is in use is not something this file can know.
# Binding both costs a line and settles it.
#
# The tmux-native alternative is set-clipboard, which wraps the text in an OSC
# 52 escape and lets the outer terminal do the copying -- the right answer over
# ssh, where xsel would be reaching for a display that is not there. It needs a
# terminal that honours OSC 52, which is not all of them, so prefer xsel here
# and reach for set-clipboard on the machines that have no X to talk to.
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'xsel -ib'
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-and-cancel 'xsel -ib'

# Shift-drag asks the terminal to ignore mouse reporting for the duration and
# select the way it would with no tmux in the way, which is still the escape
# hatch when a selection has to cross a pane border. It selects what is on the
# screen rather than what is in a pane, though, so a split comes out
# interleaved. This toggle turns the mouse off outright for the times that
# matters, and reports which way it went, since the mouse is invisible until
# you use it.
bind m set -g mouse \; display 'mouse #{?mouse,on,off}'

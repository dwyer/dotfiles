# tmux sends 24-bit colour through to the outer terminal only where it thinks
# that terminal can take it, and it decides that from the terminal's terminfo.
# xterm-256color does not advertise RGB, so everything 24-bit gets flattened to
# the nearest of the 256 palette entries on the way out: solarized's blue-greys
# average out into the greyscale ramp and arrive neutral, which is visible
# anywhere a highlight paints a background -- vim's CursorLine, ColorColumn,
# the popup menu -- and shows up as vim looking different inside tmux and out.
#
# $COLORTERM is how a truecolor terminal says so when its terminfo entry does
# not, and it is what ~/.vimrc consults for the same decision, so consult it
# here too and keep the two in agreement. The catch is that this reads the tmux
# server's environment, fixed when the server started, so a later client
# attaching from a poorer terminal is judged by the first one's $COLORTERM.
# Getting that wrong costs approximate colour, which is what not setting this
# costs anyway.
if-shell '[ "$COLORTERM" = "truecolor" ] || [ "$COLORTERM" = "24bit" ]' \
    'set -as terminal-features ",*:RGB"'

# Machine-local settings, as with the shell files.
if-shell '[ -f ~/.tmux.conf.local ]' 'source-file ~/.tmux.conf.local'
